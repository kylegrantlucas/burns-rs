[package]
name = "burns-depth"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Pinned Depth Anything V2 depth estimation: portable pre/postprocessing and an optional native ONNX Runtime service"

[features]
default = []
native = ["dep:ort", "dep:reqwest", "dep:tokio", "dep:directories", "dep:tempfile"]

[dependencies]
burns = { path = "../burns", default-features = false }
image.workspace = true
serde.workspace = true
thiserror.workspace = true
sha2.workspace = true
hex.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ort = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
directories = { workspace = true, optional = true }
tempfile = { workspace = true, optional = true }

[dev-dependencies]
serde_json.workspace = true
