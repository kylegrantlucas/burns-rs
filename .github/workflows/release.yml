name: Release

# A manual run builds and uploads the archives as workflow artifacts without
# publishing a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # The ONNX Runtime CPU release bundled under runtime/lib/ for depth generation;
  # the same version the project shell supplies.
  ORT_VERSION: 1.27.1

jobs:
  build:
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 keeps the glibc requirement low enough for older distros.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            ort: linux-x64
            ort_sha256: 25b1ef1fea1acd210d63f8f24dc870ad6e077795ce1f54876252c6d3803c15af
            ort_lib: libonnxruntime.so
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            ort: linux-aarch64
            ort_sha256: 33c67e33d1e25b816878366ea276589a024f71f000e7ff955c4b33224d639edd
            ort_lib: libonnxruntime.so
          - target: aarch64-apple-darwin
            runner: macos-15
            ort: osx-arm64
            ort_sha256: e42b77a7281cc6e55141bf44fcfbac2c782b823a491bbb6ac33c781dd991f8a6
            ort_lib: libonnxruntime.dylib
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)
          if [ -z "$version" ] || [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version ${version:-<missing>}"
            exit 1
          fi

      - name: Fetch ONNX Runtime
        shell: bash
        run: |
          archive="onnxruntime-${{ matrix.ort }}-$ORT_VERSION.tgz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/microsoft/onnxruntime/releases/download/v$ORT_VERSION/$archive"
          (cd "$RUNNER_TEMP" && echo "${{ matrix.ort_sha256 }}  $archive" | shasum -a 256 -c -)
          mkdir -p "$RUNNER_TEMP/onnxruntime"
          tar -xzf "$RUNNER_TEMP/$archive" --strip-components 1 -C "$RUNNER_TEMP/onnxruntime"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p burns-cli -p burns-gui

      - name: Smoke native CLI (Linux)
        if: runner.os == 'Linux'
        run: |
          target/${{ matrix.target }}/release/burns --version
          target/${{ matrix.target }}/release/burns presets

      - name: Package
        shell: bash
        run: |
          # Branch names may contain slashes on manual runs.
          name="burns-${GITHUB_REF_NAME//\//-}-${{ matrix.target }}"
          stage="dist/$name"
          mkdir -p "$stage/site/public"
          cp target/${{ matrix.target }}/release/burns target/${{ matrix.target }}/release/burns-gui "$stage/"
          cp -R presets docs README.md LICENSE-MIT LICENSE-APACHE "$stage/"
          # The README header image.
          cp site/public/favicon.svg "$stage/site/public/"

          # Ship the notices for the fonts embedded in burns-gui.
          font_dir=$(cargo metadata --locked --format-version 1 --filter-platform "${{ matrix.target }}" \
            | python3 -c 'import json, pathlib, sys; p = next(p for p in json.load(sys.stdin)["packages"] if p["name"] == "epaint_default_fonts"); print(pathlib.Path(p["manifest_path"]).parent / "fonts")')
          mkdir -p "$stage/licenses/egui-fonts"
          cp "$font_dir"/*.txt "$stage/licenses/egui-fonts/"

          # burns-depth loads the runtime from runtime/lib/ beside the executables.
          ort="$RUNNER_TEMP/onnxruntime"
          mkdir -p "$stage/runtime/lib" "$stage/licenses/onnxruntime"
          cp -L "$ort/lib/${{ matrix.ort_lib }}" "$stage/runtime/lib/"
          cp "$ort/LICENSE" "$ort/ThirdPartyNotices.txt" "$ort/VERSION_NUMBER" "$ort/GIT_COMMIT_ID" \
            "$stage/licenses/onnxruntime/"

          tar -C dist -czf "dist/$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    # Only a tag push publishes; a manual run against a tag stays artifact-only.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- *.tar.gz > SHA256SUMS
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
